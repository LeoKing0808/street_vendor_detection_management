version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: vendor_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vendor_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "100m" # 单个日志文件最大100MB
        max-file: "3" # 最多保留3个文件

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  ai-engine:
    build: ./ai-engine
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "100m" # 单个日志文件最大100MB
        max-file: "3" # 最多保留3个文件

volumes:
  postgres_data:
